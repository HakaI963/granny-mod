name: modded-apk

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL that serves the shipped base APK
        required: false
        default: ""
      split_url:
        description: URL that serves the arm64 config split APK
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:

env:
  LUA_VERSION: 5.4.7
  PKG: com.dvloper.granny.mod

jobs:
  loader:
    name: native loader + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor Lua
        run: |
          mkdir -p loader/vendor
          # lua.org times out occasionally (curl exit 28), which is not a reason
          # to fail a build; retry, then fall back to the GitHub mirror.
          ok=0
          for url in \
            "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" \
            "https://github.com/lua/lua/archive/refs/tags/v${LUA_VERSION}.tar.gz"; do
            for try in 1 2 3; do
              if curl -fsSL --retry 2 --connect-timeout 20 -m 180 "$url" -o lua.tgz; then
                ok=1; echo "fetched $url"; break
              fi
              echo "attempt $try failed for $url"
            done
            [ "$ok" = 1 ] && break
          done
          test "$ok" = 1 || { echo "could not fetch Lua" >&2; exit 1; }
          tar xzf lua.tgz
          srcdir="lua-${LUA_VERSION}/src"
          [ -d "$srcdir" ] || srcdir="$(find . -maxdepth 2 -type d -name src -path '*lua*' | head -1)"
          cp -r "$srcdir" loader/vendor/lua
          # lua.h and friends must be flat for the CMake source list
          test -f loader/vendor/lua/lapi.c
          test -f loader/vendor/lua/lua.h

      - name: Host tests
        run: |
          python3 patch/test_rename.py
          gcc -std=gnu11 -Wall -Wextra -Iloader/src -Iloader/test/shim \
              -o /tmp/gmtest loader/src/mods.c loader/test/harness.c
          /tmp/gmtest

      - name: Link check every module
        run: |
          # Compiling each .c proves nothing about the CMake source list: a file
          # left out of it compiles fine and only fails at link time. Link the
          # whole set as a host shared object first.
          gcc -shared -fPIC -o /tmp/hostgrannymod.so \
              -Iloader/src -Iloader/test/shim \
              $(ls loader/src/*.c | grep -v scripts.c) -lpthread
          nm -D /tmp/hostgrannymod.so | grep -c "gm_"
          # and confirm CMakeLists names every source file that exists
          for f in loader/src/*.c; do
            b=$(basename "$f")
            case "$b" in
              scripts.c) continue ;;
            esac
            grep -q "src/$b" loader/CMakeLists.txt || { echo "CMakeLists.txt is missing src/$b" >&2; exit 1; }
          done
          echo "all modules are in the build"

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          # ubuntu runners already ship the SDK command line tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build libgrannymod.so
        run: |
          cmake -S loader -B loader/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build loader/build -j "$(nproc)"
          test -f loader/build/libgrannymod.so
          readelf -d loader/build/libgrannymod.so | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: loader-so
          path: loader/build/libgrannymod.so

  apk:
    name: modded granny apk
    needs: loader
    # Only when the shipped base + split APKs are supplied; they are not
    # committed here (see README "Legal").
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner

      - name: Fetch the staged APKs
        uses: actions/download-artifact@v4
        with:
          name: loader-so
          path: loader/build

      - name: Stage the shipped APKs
        env:
          BASE_URL: ${{ inputs.base_url }}
          SPLIT_URL: ${{ inputs.split_url }}
        run: |
          mkdir -p base
          test -n "$BASE_URL" && test -n "$SPLIT_URL" || { echo "base_url/split_url required" >&2; exit 1; }
          curl -fsSL "$BASE_URL"  -o base/granny-base.apk
          curl -fsSL "$SPLIT_URL" -o base/granny-arm64.apk

      - name: Build
        run: |
          chmod +x build.sh
          bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: granny-modded-apk
          path: granny-modded.apk
